[package]
name = "one-engine-store"
version = "0.1.0"
description = "OneEngine Store Desktop Launcher"
authors = ["OneEngine Systems"]
edition = "2021"

[lib]
name = "one_engine_store_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
