name: Release launcher

# Push a tag like v1.0.1 (matching package.json) to build the Windows installer. The installer is attached
# to a release on this repo (private, for the team) and published on the public OneEngine repo, which the
# download page reads. To rebuild an existing tag, use "Run workflow" and enter the tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build, e.g. v1.0.0'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  PUBLIC_RELEASES_REPO: oneenginedev/oneengine

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Tag must match package.json version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match package.json version v$version"
            exit 1
          fi

      - run: npm ci

      - name: Platform API address must be set
        shell: bash
        env:
          PLATFORM_API_URL: ${{ vars.PLATFORM_API_URL }}
        run: |
          # The installer has this address built in. Without it the app would look for a server on the
          # player's own PC and nobody could sign in.
          case "$PLATFORM_API_URL" in
            https://*) ;;
            *) echo "Set the repository variable PLATFORM_API_URL to your public https:// Platform API address (Settings > Secrets and variables > Actions > Variables)."; exit 1 ;;
          esac

      - name: Build installer
        run: npm run dist
        env:
          # Address of the Platform API baked into this build (repository variable, required)
          VITE_PLATFORM_API_URL: ${{ vars.PLATFORM_API_URL }}

      - name: Write release notes
        shell: bash
        run: |
          previous=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          if [ -n "$previous" ]; then range="$previous..$TAG"; else range="$TAG"; fi
          git log --no-merges --pretty='- %s' "$range" > notes.md
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          echo "FLAGS=$flags" >> "$GITHUB_ENV"

      - name: Release on this repo
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/OneEngine-Store-Setup-*.exe --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release/OneEngine-Store-Setup-*.exe \
              --repo "$GITHUB_REPOSITORY" \
              --title "OneEngine Store $TAG" \
              --notes-file notes.md $FLAGS
          fi

      - name: Publish on the public repo (download page)
        shell: bash
        env:
          # Fine-grained token with "Contents: read and write" on the public releases repo
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Add the RELEASES_TOKEN repository secret to publish on the download page."
            exit 1
          fi
          if gh release view "$TAG" --repo "$PUBLIC_RELEASES_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" release/OneEngine-Store-Setup-*.exe --repo "$PUBLIC_RELEASES_REPO" --clobber
          else
            gh release create "$TAG" release/OneEngine-Store-Setup-*.exe \
              --repo "$PUBLIC_RELEASES_REPO" \
              --title "OneEngine Store $TAG" \
              --notes-file notes.md $FLAGS
          fi
