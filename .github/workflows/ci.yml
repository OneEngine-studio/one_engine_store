name: OneEngine Store CI

on:
  push:
    branches: [ main, prabhashi ]
  pull_request:
    branches: [ main, prabhashi ]

jobs:
  validate-and-build:
    name: Typecheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Static Typecheck
        run: npx tsc --noEmit

      - name: Vite Production Build
        run: npm run build

      - name: Verify Distribution Artifacts
        run: |
          test -f dist/index.html || { echo "dist/index.html not found"; exit 1; }
          echo "Production build verified successfully."
