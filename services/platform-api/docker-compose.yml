# Runs the Platform API with automatic HTTPS (Caddy).
#   cp .env.production.example .env.production   # then fill it in
#   docker compose --env-file .env.production up -d --build
services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - oneengine-data:/data
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  oneengine-data:
  caddy-data:
  caddy-config:
